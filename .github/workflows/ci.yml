name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [18, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Generated artifacts are fresh (exit 4 on drift)
        run: node scripts/build-content.mjs --check
      - run: npm run lint
      - run: npm test
      - run: npm pack --dry-run
      - name: Behavioral evals on fixtures (release gates)
        run: |
          node bin/prumo.mjs eval --fixtures pass
          node bin/prumo.mjs eval --fixtures fail
